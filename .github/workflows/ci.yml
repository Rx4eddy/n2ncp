name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: n2ncp
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: n2ncp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U n2ncp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DEBUG: '1'
      SECRET_KEY: ci-only-not-for-deployment
      DATABASE_URL: postgresql://n2ncp:ci-test-only@localhost:5432/n2ncp
      TEST_DATABASE_URL: postgresql://n2ncp:ci-test-only@localhost:5432/n2ncp
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: ruff check . && ruff format --check .
      - run: npm run check && npm run build
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput && python manage.py seed
      - run: pytest --cov=apps --cov=config --cov-report=term-missing
      - run: python manage.py check
      - run: python manage.py collectstatic --noinput
      - run: cp .env.example .env && docker compose config --quiet && docker compose -f docker-compose.prod.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell startup and settings preservation
        shell: powershell
        run: .\scripts\Test-WindowsSetup.ps1
