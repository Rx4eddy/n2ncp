<article class="problem-card"><div class="problem-top"><span class="platform-tag {{ item.problem.platform }}">{{ item.problem.platform|title }}</span><span class="difficulty">Level {{ item.problem.difficulty }} / 5</span></div><h3><a href="{{ item.problem.url }}" target="_blank" rel="noopener noreferrer">{{ item.problem.title }} <span>↗</span></a></h3><div class="tags">{% for topic in item.problem.topics.all %}<a href="{% url 'recommendations' %}?topic={{ topic.slug }}">{{ topic.name }}</a>{% endfor %}</div><p class="recommendation-reason"><span>✧</span> {{ item.reason }}</p><form class="attempt-form" action="{% url 'attempt' %}" method="post">{% csrf_token %}<input type="hidden" name="problem" value="{{ item.problem.pk }}"><label class="sr-only" for="outcome-{{ item.problem.pk }}">Practice outcome for {{ item.problem.title }}</label><select id="outcome-{{ item.problem.pk }}" name="outcome"><option value="struggled">Still working</option><option value="hinted">Solved with help</option><option value="independent">Solved independently</option></select><button class="button small" type="submit">Record attempt</button></form></article>
